<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divya · Memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+Tamil:wght@400;700&family=Noto+Serif+Tamil:wght@500;700&family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--gold:#e8c36a;--gold2:#f6dfa0;--leaf:#7fb069;--rose:#f2a0a8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden}
  body{font-family:'Poppins',system-ui,sans-serif;color:#fff}
  .ta{font-family:'Noto Sans Tamil','Nirmala UI','Latha','FreeSerif',sans-serif}
  .tas{font-family:'Noto Serif Tamil','Nirmala UI','Latha','FreeSerif',serif}

  #stage{position:absolute;left:50%;top:50%;width:720px;height:1280px;margin:-640px 0 0 -360px;overflow:hidden;
    background:radial-gradient(900px 900px at 50% 40%,#1b3a2b,#08120d 70%);transform-origin:50% 50%}
  .layer{position:absolute;inset:0}
  .scene{position:absolute;inset:0;perspective:1400px;visibility:hidden}
  .bg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(28px) brightness(.42) saturate(1.2)}
  .card{position:absolute;left:50%;top:540px;transform-style:preserve-3d;backface-visibility:hidden}
  .card .in{position:absolute;inset:0;padding:10px;border-radius:22px;background:linear-gradient(150deg,#f6dfa0,#a8802e 45%,#f6dfa0);
    box-shadow:0 40px 80px rgba(0,0,0,.65),0 0 60px rgba(232,195,106,.25)}
  .card img{width:100%;height:100%;object-fit:cover;border-radius:14px;display:block}
  .card .shine{position:absolute;inset:10px;border-radius:14px;pointer-events:none;
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);background-size:300% 100%}
  .cap{position:absolute;left:40px;right:40px;bottom:70px;text-align:center;padding:26px 26px 22px;border-radius:26px;
    background:linear-gradient(180deg,rgba(10,25,18,.55),rgba(10,25,18,.8));border:1px solid rgba(232,195,106,.35);backdrop-filter:blur(6px)}
  .cap .t{font-size:35px;line-height:1.55;font-weight:700;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .cap .e{margin-top:10px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:30px;color:var(--gold2)}
  .w{display:inline-block;white-space:pre}
  .num{position:absolute;top:56px;left:0;right:0;text-align:center;font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:.4em;color:var(--gold)}

  /* intro */
  #intro .rays{position:absolute;left:50%;top:44%;width:1800px;height:1800px;margin:-900px 0 0 -900px;border-radius:50%;
    background:repeating-conic-gradient(from 0deg,rgba(246,223,160,.10) 0 6deg,transparent 6deg 18deg);
    -webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%)}
  #intro .small{position:absolute;top:360px;left:0;right:0;text-align:center;font-family:'Cormorant Garamond',serif;font-size:34px;letter-spacing:.3em;color:var(--gold2);text-transform:uppercase}
  #intro .big{position:absolute;top:430px;left:0;right:0;text-align:center;font-size:150px;font-weight:700;line-height:1.3;
    background:linear-gradient(90deg,#e8c36a,#fff3cf,#e8c36a);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 30px rgba(232,195,106,.5))}
  #intro .sub{position:absolute;top:690px;left:0;right:0;text-align:center;font-size:40px;color:#fff}
  #intro .sub2{position:absolute;top:770px;left:0;right:0;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:32px;color:var(--gold2)}

  /* message + poem */
  #msgScene{perspective:1200px}
  .ring{position:absolute;left:50%;top:300px;width:0;height:0;transform-style:preserve-3d}
  .ring .th{position:absolute;width:190px;height:250px;margin:-125px 0 0 -95px;border-radius:16px;overflow:hidden;
    border:4px solid rgba(246,223,160,.85);box-shadow:0 20px 40px rgba(0,0,0,.5);backface-visibility:hidden}
  .ring .th img{width:100%;height:100%;object-fit:cover}
  .text{position:absolute;left:50px;right:50px;top:600px;text-align:center}
  .line{font-size:38px;line-height:1.5;font-weight:700;margin:6px 0;text-shadow:0 2px 14px rgba(0,0,0,.8)}
  .line.en{font-family:'Great Vibes','URW Chancery L','Z003',cursive;font-weight:400;font-size:64px;color:var(--gold2)}
  .ptitle{font-size:34px;color:var(--gold);letter-spacing:.1em;margin-bottom:14px}
  .pline{font-size:42px;line-height:1.45;font-weight:700;color:#fff8e6;text-shadow:0 0 20px rgba(232,195,106,.45)}

  /* finale */
  #finale .halo{position:absolute;left:50%;top:430px;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;
    background:conic-gradient(var(--gold),var(--leaf),var(--rose),var(--gold2),var(--gold));filter:blur(14px)}
  #finale .face{position:absolute;left:50%;top:430px;width:390px;height:390px;margin:-195px 0 0 -195px;border-radius:50%;overflow:hidden;border:8px solid #f6dfa0}
  #finale .face img{width:100%;height:100%;object-fit:cover;object-position:center 18%}
  #finale .hb{position:absolute;top:665px;left:0;right:0;text-align:center;white-space:nowrap;font-family:'Great Vibes','URW Chancery L','Z003',cursive;font-size:96px;line-height:1.2;color:var(--gold2);
    text-shadow:0 0 30px rgba(232,195,106,.7)}
  #finale .nm{position:absolute;top:790px;left:0;right:0;text-align:center;white-space:nowrap;font-family:'Great Vibes','URW Chancery L','Z003',cursive;font-size:150px;line-height:1.2;color:#fff;text-shadow:0 0 40px rgba(246,223,160,.8)}
  #finale .tw{position:absolute;top:990px;left:0;right:0;text-align:center;font-size:44px;font-weight:700}
  #finale .sig{position:absolute;top:1090px;left:0;right:0;text-align:center;font-size:32px;color:var(--gold2)}

  #flash{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
    background:radial-gradient(600px 500px at 20% 15%,rgba(255,190,120,.9),transparent 70%),radial-gradient(500px 600px at 85% 80%,rgba(246,223,160,.7),transparent 70%)}
  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.7) 100%)}
  #fx{position:absolute;inset:0;pointer-events:none}
  #fade{position:absolute;inset:0;background:#000;pointer-events:none}

  /* controls */
  #play{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;cursor:pointer;
    background:radial-gradient(circle at 50% 45%,rgba(27,58,43,.92),rgba(0,0,0,.96))}
  #play .btn{width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:70px;color:#2a2208;padding-left:12px;
    background:linear-gradient(135deg,#f6dfa0,#e8c36a);box-shadow:0 0 0 0 rgba(232,195,106,.6);animation:ping 1.8s infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(232,195,106,.6)}100%{box-shadow:0 0 0 50px rgba(232,195,106,0)}}
  #play .l1{font-size:40px;font-weight:700}
  #play .l2{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:32px;color:var(--gold2)}
  #play .l3{font-size:22px;color:#c9c2ad}
  #songs{display:flex;flex-direction:column;gap:12px;width:560px}
  #songs .sg{font:600 24px 'Poppins',sans-serif;padding:16px 22px;border-radius:18px;border:2px solid rgba(232,195,106,.45);
    background:rgba(255,255,255,.05);color:#fff;text-align:left;cursor:pointer}
  #songs .sg small{display:block;font-weight:400;font-size:18px;color:#c9c2ad}
  #songs .sg.on{border-color:#f6dfa0;background:rgba(232,195,106,.2);box-shadow:0 0 24px rgba(232,195,106,.35)}
  #songs .sg.off{display:none}
  #play .btn{cursor:pointer}
  #bar{position:absolute;left:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--gold),var(--gold2));z-index:15;width:0}
  #end{position:absolute;left:0;right:0;bottom:40px;z-index:16;display:none;justify-content:center;gap:16px}
  #end a,#end button{font:600 26px 'Poppins',sans-serif;padding:16px 30px;border-radius:999px;border:0;cursor:pointer;text-decoration:none;
    background:linear-gradient(90deg,#e8c36a,#f6dfa0);color:#2a2208}
  body.render #play,body.render #bar,body.render #end{display:none!important}
</style>
</head>
<body>
<div id="stage">
  <div id="scenes" class="layer"></div>

  <div id="intro" class="scene">
    <div class="rays"></div>
    <div class="small">For someone special</div>
    <div class="big ta">திவ்யா</div>
    <div class="sub ta">ஒரு நட்பின் நினைவுப் பயணம்</div>
    <div class="sub2">a journey of friendship</div>
  </div>

  <div id="msgScene" class="scene">
    <div class="ring" id="ring"></div>
    <div class="text" id="msgText"></div>
    <div class="text" id="poemText"></div>
  </div>

  <div id="finale" class="scene">
    <div class="halo"></div>
    <div class="face"><img src="../photo1.jpg" alt=""></div>
    <div class="hb">Happy Birthday</div>
    <div class="nm">Divya</div>
    <div class="tw ta">இனிய பிறந்தநாள் வாழ்த்துகள் 🎂</div>
    <div class="sig ta">— என்றும் உன் நண்பன் 💛</div>
  </div>

  <canvas id="fx" width="720" height="1280"></canvas>
  <div id="flash"></div>
  <div id="vig"></div>
  <div id="fade"></div>

  <div id="bar"></div>
  <div id="end"><button id="replay">↺ Replay</button><a id="dl" href="divya-memories-all-3-songs.mp4" download>⬇ Download video</a></div>
  <div id="play">
    <div class="btn">▶</div>
    <div class="l1 ta">உனக்காக ஒரு சின்ன சர்ப்ரைஸ் 🎁</div>
    <div class="l2">Tap to play your memories</div>
    <div class="l3">🔊 turn the sound on · choose a song</div>
    <div id="songs"></div>
  </div>
</div>

<audio id="music" src="friendship.mp3" preload="auto"></audio>

<script>
/* ====== SONGS: put the mp3 files in this "memories" folder with these names ======
   start = second of the song where the video should begin (e.g. skip a long intro) */
const SONGS = [
  {file:"medley.mp3", title:"All 3 songs together 💛", sub:"Oh My Kadavule → Yealae Yealae → Othaiyila", start:0, mp4:"divya-memories-all-3-songs.mp4"},
  {file:"song1.mp3", title:"Oh My Kadavule – Friendship Anthem", sub:"Leon James", start:0, loop:true, mp4:"divya-memories-oh-my-kadavule.mp4"},
  {file:"song2.mp3", title:"Yealae Yealae Dosthu", sub:"Endrendrum Punnagai · Harris Jayaraj", start:0, loop:true, mp4:"divya-memories-yealae-yealae-dosthu.mp4"},
  {file:"song3.mp3", title:"Othaiyila", sub:"Endrendrum Punnagai · Harris Jayaraj", start:0, loop:true, mp4:"divya-memories-othaiyila.mp4"},
  {file:"friendship.mp3", title:"Original friendship tune", sub:"made for this video", start:0, mp4:"divya-birthday-memories.mp4"},
];
/* ================================================================================ */
const TOTAL = 128;
const PHOTOS = [
  ["m01.jpg","முதல் சந்திப்பு ஒரு சாதாரண நாள் தான்… ஆனால் அதுவே ஒரு அழகான நட்பின் தொடக்கம்","Where it all began"],
  ["m02.jpg","ஒன்றாக நடந்த பாதைகள், ஒன்றாக சிரித்த நிமிடங்கள்","Every road was better together"],
  ["m03.jpg","ஒரே உடை, ஒரே கனவு — ஒரு குடும்பம் போல நாம்","Same dreams, same team"],
  ["m04.jpg","எண்ணக்கூடிய நாட்கள் தான்… ஆனால் எண்ண முடியாத நினைவுகள்","Countable days, countless memories"],
  ["m05.jpg","இரவின் விளக்குகளை விட நம் சிரிப்பு தான் அதிகம் மின்னியது","We were the brightest lights"],
  ["m06.jpg","அந்த சிரிப்பும் கிண்டலும் இன்று ரொம்ப மிஸ் ஆகுது…","Missing all your fun…"],
  ["m07.jpg","வரையறுக்க முடியாத வரலாறு, உடைக்க முடியாத பந்தம்","Undefined histories · Unbreakable bond"],
  ["m08.jpg","மேடையில் நின்ற அந்த நிமிடங்கள், மனதில் என்றும் நிற்கும்","Moments that stay forever"],
  ["m09.jpg","மாலை வானம் போல் மெதுவாக, அழகாக வளர்ந்தது நம் நட்பு","Our friendship, like a sunset sky"],
  ["m10.jpg","தோளோடு தோள் நின்ற நண்பர்கள் — காலம் பிரித்தாலும் மனம் பிரியாது","Time may part us, hearts never will"],
  ["m11.jpg","எங்கே இருந்தாலும், என்றும் நாம் ஒன்றாகத்தான்","Wherever we are, always together"],
];
const MESSAGE = [
  ["கிட்டத்தட்ட ஒன்றரை வருஷம் ஆச்சு…",""],
  ["எப்பவும் பேசலைனாலும்,",""],
  ["நான் எப்பவுமே உன் ஃப்ரெண்டு தான் 💛",""],
  ["எந்த இடத்துலயாவது உன்னை கோபப்படுத்தியிருந்தாலோ,",""],
  ["வெறுப்பேத்தியிருந்தாலோ — எல்லாத்துக்குமே சாரி 🙏",""],
  ["Happy Birthday to you, Divya!","en"],
];
const POEM = [
  "பூக்கள் பூக்கும் இந்நாளில்",
  "உன் புன்னகை இன்னும் மலரட்டும்;",
  "தூரம் நம்மைப் பிரித்தாலும்",
  "நட்பு நம்மை இணைக்கட்டும்.",
  "வாழ்க்கை முழுதும் வசந்தமாய்",
  "வாழ்க நீ பல்லாண்டு! 🌸",
];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo = x => 1-Math.pow(1-clamp(x),3);
const eio = x => { x=clamp(x); return x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; };
const back = x => { x=clamp(x); const c=1.7; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); };
const win = (t,a,b,fi=.8,fo=.8)=> clamp((t-a)/fi)*(1-clamp((t-(b-fo))/fo));
const words = s => s.split(' ').map(w=>`<span class="w">${w} </span>`).join('');

/* ---------- build photo scenes ---------- */
const scenesEl = $('scenes'), S = [];
PHOTOS.forEach(([src,ta,en],i)=>{
  const d = document.createElement('div'); d.className='scene';
  d.innerHTML = `<div class="bg" style="background-image:url(${src})"></div>
    <div class="num">${String(i+1).padStart(2,'0')} / ${PHOTOS.length}</div>
    <div class="card"><div class="in"><img src="${src}"></div><div class="shine"></div></div>
    <div class="cap"><div class="t ta">${words(ta)}</div><div class="e">${en}</div></div>`;
  scenesEl.appendChild(d);
  const img = d.querySelector('.card img');
  const o = {el:d,bg:d.querySelector('.bg'),card:d.querySelector('.card'),shine:d.querySelector('.shine'),cap:d.querySelector('.cap'),
             ws:[...d.querySelectorAll('.cap .w')],en:d.querySelector('.cap .e'),num:d.querySelector('.num'),img,start:6+i*6,end:12+i*6,type:i%4,w:560,h:720};
  const size = ()=>{ const r = img.naturalWidth/img.naturalHeight || .75; let w=600,h=w/r; if(h>760){h=760;w=h*r;}
    o.w=w+20; o.h=h+20; o.card.style.width=o.w+'px'; o.card.style.height=o.h+'px'; o.card.style.marginLeft=(-o.w/2)+'px'; o.card.style.marginTop=(-o.h/2)+'px'; };
  img.complete ? size() : img.addEventListener('load', size);
  S.push(o);
});
// ring thumbs
const ring = $('ring'), TH = [];
PHOTOS.forEach(([src],i)=>{ const d=document.createElement('div'); d.className='th'; d.innerHTML=`<img src="${src}">`; ring.appendChild(d); TH.push(d); });
$('msgText').innerHTML = MESSAGE.map(([l,c])=>`<div class="line ${c||'ta'}">${l}</div>`).join('');
$('poemText').innerHTML = `<div class="ptitle ta">✦ உனக்கான ஒரு கவிதை ✦</div>` + POEM.map(l=>`<div class="pline tas">${l}</div>`).join('');
const msgLines = [...document.querySelectorAll('#msgText .line')];
const poemLines = [...document.querySelectorAll('#poemText .pline')];
const ptitle = document.querySelector('#poemText .ptitle');

const show = (el,v)=>{ el.style.visibility = v ? 'visible' : 'hidden'; };

/* ---------- deterministic particles ---------- */
const cx = $('fx').getContext('2d');
function rand(i){ const x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }
const BOKEH = Array.from({length:46},(_,i)=>({x:rand(i)*720,y:rand(i+99)*1280,r:4+rand(i+7)*22,sp:12+rand(i+3)*30,ph:rand(i+5)*6.28,c:i%3}));
const CONF = Array.from({length:180},(_,i)=>({x:rand(i+500)*720,d:rand(i+700)*6,sp:160+rand(i+900)*220,sw:20+rand(i+40)*50,w:8+rand(i+60)*10,h:5+rand(i+80)*6,
  rs:(rand(i+20)-.5)*8,c:['#e8c36a','#f6dfa0','#7fb069','#f2a0a8','#ffffff','#ffb86b'][i%6]}));
function particles(t){
  cx.clearRect(0,0,720,1280);
  cx.globalCompositeOperation='lighter';
  const party = t>114 ? 1.8 : (t>96 ? 1.3 : 1);
  for(const b of BOKEH){
    const y = ((b.y - t*b.sp) % 1380 + 1380) % 1380 - 50, x = b.x + Math.sin(t*.6+b.ph)*30;
    const a = (.10 + .12*Math.sin(t*1.3+b.ph)**2) * party;
    const g = cx.createRadialGradient(x,y,0,x,y,b.r);
    const col = b.c===0 ? '246,223,160' : b.c===1 ? '255,190,120' : '183,228,160';
    g.addColorStop(0,`rgba(${col},${a})`); g.addColorStop(1,`rgba(${col},0)`);
    cx.fillStyle=g; cx.beginPath(); cx.arc(x,y,b.r,0,6.3); cx.fill();
  }
  cx.globalCompositeOperation='source-over';
  if (t>114.3){
    const lt = t-114.3;
    for(const c of CONF){
      const tt = lt - c.d*0.25; if (tt<0) continue;
      const y = -30 + tt*c.sp; if (y>1310) continue;
      const x = c.x + Math.sin(tt*2+c.d)*c.sw;
      cx.save(); cx.translate(x,y); cx.rotate(tt*c.rs); cx.scale(Math.cos(tt*3+c.d),1); cx.fillStyle=c.c; cx.fillRect(-c.w/2,-c.h/2,c.w,c.h); cx.restore();
    }
  }
}

/* ---------- render a frame for time t ---------- */
function render(t){
  // intro 0–6
  const ia = win(t,0,6.2,.01,.9); show($('intro'), ia>0);
  if (ia>0){
    const I=$('intro'); I.style.opacity=ia;
    I.querySelector('.rays').style.transform=`rotate(${t*8}deg) scale(${.8+t*.05})`;
    I.querySelector('.rays').style.opacity=eo(t/2);
    const sm=I.querySelector('.small'); sm.style.opacity=eo((t-.4)/1); sm.style.letterSpacing=(.8-.5*eo((t-.4)/1.5))+'em';
    const bg=I.querySelector('.big'), bp=eo((t-1)/1.6);
    bg.style.opacity=bp; bg.style.transform=`perspective(800px) translateZ(${(1-bp)*-500}px) rotateX(${(1-bp)*40}deg)`; bg.style.filter=`blur(${(1-bp)*16}px) drop-shadow(0 0 30px rgba(232,195,106,.5))`;
    const sb=I.querySelector('.sub'); sb.style.opacity=eo((t-2.4)/1); sb.style.transform=`translateY(${(1-eo((t-2.4)/1))*30}px)`;
    const s2=I.querySelector('.sub2'); s2.style.opacity=eo((t-3.2)/1);
  }

  // photo scenes
  for(const o of S){
    const vis = t>o.start-0.5 && t<o.end+0.5; show(o.el, vis); if(!vis) continue;
    const p = (t-o.start)/6, inP = eo((t-(o.start-0.45))/1.15), outP = eio((t-(o.end-0.55))/0.95);
    o.bg.style.opacity = clamp((t-(o.start-0.5))/1)*(1-clamp((t-(o.end-0.3))/0.8));
    o.bg.style.transform = `scale(${1.05+p*.12})`;
    let tr='', op=1;
    const k = 1-inP;
    if (o.type===0) tr=`translateZ(${-400*k}px) rotateY(${-95*k}deg)`;
    else if (o.type===1) tr=`translateY(${-200*k}px) rotateX(${85*k}deg)`;
    else if (o.type===2){ tr=`scale(${.2+.8*back((t-(o.start-0.45))/1.15)}) rotateZ(${-18*k}deg)`; op=inP; }
    else tr=`translateX(${720*k}px) rotateY(${60*k}deg) rotateZ(${8*k}deg)`;
    const sway = `rotateY(${7*Math.sin(p*Math.PI*1.2)}deg) rotateX(${3*Math.cos(p*Math.PI)}deg) scale(${1+.05*clamp(p)})`;
    const out = `translateZ(${-700*outP}px) rotateY(${(o.type%2?40:-40)*outP}deg) translateY(${-60*outP}px)`;
    o.card.style.transform = `${out} ${tr} ${sway}`;
    o.card.style.opacity = op*(1-outP);
    o.shine.style.backgroundPosition = `${160-260*clamp((p-.25)/.5)}% 0`;
    const cIn = eo((t-(o.start+0.5))/0.6);
    o.cap.style.opacity = cIn*(1-clamp((t-(o.end-0.6))/0.5)); o.cap.style.transform=`translateY(${(1-cIn)*40}px)`;
    o.ws.forEach((w,j)=>{ const a=eo((t-(o.start+0.8+j*0.16))/0.45); w.style.opacity=a; w.style.transform=`translateY(${(1-a)*18}px)`; w.style.filter=`blur(${(1-a)*6}px)`; });
    const ea = eo((t-(o.start+0.9+o.ws.length*0.16))/0.6); o.en.style.opacity=ea;
    o.num.style.opacity = cIn*.9*(1-outP);
  }

  // message + poem 72–114
  const ma = win(t,71.6,114.6,1.2,1.0); show($('msgScene'), ma>0);
  if (ma>0){
    $('msgScene').style.opacity = ma;
    const spin = t*14, R = 440, poem = t>=96;
    ring.style.transform = `translateZ(-${poem?260:340}px) rotateX(-10deg) rotateY(${spin}deg)`;
    TH.forEach((d,i)=>{ d.style.transform=`rotateY(${i*360/TH.length}deg) translateZ(${R}px)`; d.style.opacity = poem ? .85 : .6; });
    // message lines 72–96, one every 3.6s
    const mo = 1-clamp((t-95)/0.8);
    msgLines.forEach((l,i)=>{ const st=73+i*3.6, a=eo((t-st)/0.9); l.style.opacity=a*mo*(i<msgLines.length-1 && t>st+5 ? .75 : 1);
      l.style.transform=`translateY(${(1-a)*30}px) scale(${.96+.04*a})`; l.style.filter=`blur(${(1-a)*8}px)`; });
    // poem 96–114
    const po = clamp((t-96)/0.6)*(1-clamp((t-113.4)/0.8));
    $('poemText').style.opacity = po;
    ptitle.style.opacity = eo((t-96.2)/0.8);
    poemLines.forEach((l,i)=>{ const st=97.2+i*2.3, a=eo((t-st)/0.9); l.style.opacity=a;
      l.style.transform=`perspective(600px) rotateX(${(1-a)*70}deg) translateY(${(1-a)*20}px)`; });
  }

  // finale 114–128
  const fa = win(t,113.8,200,0.9,1); show($('finale'), fa>0);
  if (fa>0){
    const F=$('finale'); F.style.opacity=fa; const lt=t-114;
    F.querySelector('.halo').style.transform=`rotate(${lt*60}deg) scale(${back(lt/1.2)})`;
    F.querySelector('.face').style.transform=`perspective(900px) rotateY(${(1-eo(lt/1.4))*-180}deg) scale(${back(lt/1.2)})`;
    const hb=F.querySelector('.hb'), a1=back((lt-1.2)/1); hb.style.opacity=clamp((lt-1.2)/.6); hb.style.transform=`scale(${a1})`;
    const nm=F.querySelector('.nm'), a2=back((lt-2)/1); nm.style.opacity=clamp((lt-2)/.6); nm.style.transform=`scale(${a2}) rotate(${(1-clamp((lt-2)/1))*-8}deg)`;
    nm.style.textShadow=`0 0 ${30+20*Math.sin(lt*3)}px rgba(246,223,160,.85)`;
    F.querySelector('.tw').style.opacity=eo((lt-3.2)/1); F.querySelector('.tw').style.transform=`translateY(${(1-eo((lt-3.2)/1))*30}px)`;
    F.querySelector('.sig').style.opacity=eo((lt-5)/1.2);
  }

  // light-leak flash on each cut
  let fl = 0; for (const c of [6,...S.map(o=>o.end),72,96,114]) fl = Math.max(fl, Math.exp(-Math.pow((t-c)/0.35,2)));
  $('flash').style.opacity = fl*0.55;
  $('fade').style.opacity = Math.max(1-clamp(t/0.8), clamp((t-(TOTAL-1.2))/1.2));
  particles(t);
}

/* ---------- fit stage to window ---------- */
function fit(){ const s=Math.min(innerWidth/720, innerHeight/1280); $('stage').style.transform=`scale(${s})`; }
addEventListener('resize', fit); fit();

/* ---------- render mode (for exporting video) ---------- */
const params = new URLSearchParams(location.search);
if (params.has('render')){
  document.body.classList.add('render');
  document.getElementById('stage').style.transform='none';
  document.getElementById('stage').style.left='0'; document.getElementById('stage').style.top='0'; document.getElementById('stage').style.margin='0';
  window.renderAt = t => render(t);
  window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i=>i.decode().catch(()=>{}))]);
  render(0);
} else {
  /* ---------- playback ---------- */
  const audio = $('music'); let playing=false, t0=0, useClock=false, song=SONGS[SONGS.length-1];
  const box = $('songs');
  SONGS.forEach((sg,i)=>{ const b=document.createElement('button'); b.className='sg'+(i===SONGS.length-1?' on':'');
    b.innerHTML=`🎵 ${sg.title}<small>${sg.sub}</small>`; b.onclick=e=>{ e.stopPropagation(); song=sg; [...box.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); };
    box.appendChild(b); sg.btn=b;
    if (sg.file!=='friendship.mp3') fetch(sg.file,{method:'HEAD'}).then(r=>{ if(!r.ok) b.classList.add('off'); else if(!SONGS.some(x=>x.chosen)){ sg.chosen=true; b.click(); } }).catch(()=>b.classList.add('off'));
  });
  let loopOff=0, lastCT=0;
  const vt = ()=>{ if (useClock) return (performance.now()-t0)/1000;
    const ct = audio.currentTime; if (song.loop && ct < lastCT - 1) loopOff += lastCT - song.start; lastCT = ct;
    return loopOff + ct - song.start; };
  function frame(){
    const t = vt(); render(clamp(t,0,TOTAL));
    $('bar').style.width = (clamp(t,0,TOTAL)/TOTAL*100)+'%';
    if (!useClock) audio.volume = clamp((TOTAL-t)/3);           // fade the song out at the end
    if (t >= TOTAL-0.05 || (!useClock && audio.ended && !song.loop)){ playing=false; audio.pause(); $('end').style.display='flex'; try{ parent.postMessage('movieEnded','*'); }catch(e){} return; }
    requestAnimationFrame(frame);
  }
  function start(){
    $('play').style.display='none'; $('end').style.display='none';
    if (!audio.src.endsWith(song.file)) audio.src = song.file;
    audio.volume = 1; playing = true; audio.loop = !!song.loop; loopOff = 0; lastCT = song.start;
    if (song.mp4 && $('dl')) $('dl').href = song.mp4;
    const go = ()=>{ audio.currentTime = song.start; audio.play().then(()=>{ useClock=false; requestAnimationFrame(frame); })
      .catch(()=>{ useClock=true; t0=performance.now(); requestAnimationFrame(frame); }); };
    audio.readyState >= 1 ? go() : audio.addEventListener('loadedmetadata', go, {once:true});
    audio.addEventListener('error', ()=>{ if(playing && !useClock){ useClock=true; t0=performance.now(); requestAnimationFrame(frame);} }, {once:true});
  }
  $('play').onclick = e => { if (!e.target.closest('#songs')) start(); };
  $('replay').onclick = () => { $('end').style.display='none'; $('play').style.display='flex'; render(0.0001); };
  $('stage').addEventListener('click', e=>{ if(e.target.closest('#play,#end')) return; if(!playing || useClock) return;
    audio.paused ? audio.play() : audio.pause(); });
  fetch('divya-memories-all-3-songs.mp4',{method:'HEAD'}).then(r=>{ if(!r.ok) $('dl').remove(); }).catch(()=>$('dl').remove());
  render(0.0001);
}
</script>
